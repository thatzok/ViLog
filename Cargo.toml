[package]
name = "ViLog"
version = "0.3.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rumqttc = { version = "0.25", default-features = false,features = ["use-native-tls"] }
tokio = { version = "1.49", features = ["rt","macros","time"] }
pretty_env_logger = "0.5"
log = "0.4"
toml = "0.9"
reqwest = { version = "0.12.28", default-features = true }
chrono = "0.4"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "mysql", "postgres", "sqlite"] }
